version: "3.8"

services:

  postgres:
    image: postgres:16-alpine
    container_name: sweaver-postgres-db
    environment:
      POSTGRES_DB: streamweaver
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5  

  redis:
    image: redis:7-alpine
    container_name: sweaver-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: sweaver-whisper
    ports:
      - "4000:4000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sweaver-backend
    ports:
      - "8080:8080"
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/streamweaver
      REDIS_URL: redis://redis:6379/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: sweaver-backend

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: sweaver-worker
    env_file: .env.docker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/streamweaver
      REDIS_URL: redis://redis:6379/
      WHISPER_SERVER_URL: http://whisper:4000
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_started
    image: sweaver-worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sweaver-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    depends_on:
      - backend
    image: sweaver-frontend

volumes:
  pg_data: 
  media_data:
