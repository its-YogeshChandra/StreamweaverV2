[package]
name = "tests"
version = "0.1.0"
edition = "2024"

# Each file in src/bin/ becomes a separately runnable binary.
# Run a specific test binary with:
#   cargo run --bin test_upload
#   cargo run --bin test_health

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
jsonwebtoken = "9.3.1"
chrono = "0.4.44"
dotenv = "0.15.0"
