[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
actix-multipart = "0.7.2"
actix-web = "4.13.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.22.0", features = ["v4"] }
reqwest = "0.13.2"
jsonwebtoken = {version = "10.4.0", features = ["aws_lc_rs"] }
actix-cors = "0.7.1"
